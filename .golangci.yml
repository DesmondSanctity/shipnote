version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

  settings:
    depguard:
      rules:
        # Forbid outbound network packages outside the two allowed islands
        # (internal/collect/github and internal/ai). Code that legitimately
        # needs HTTP must route through one of those packages, or land an
        # ADR to widen the allow-list.
        forbid-network-outside-allowed:
          list-mode: lax
          files:
            - "!**/internal/collect/github/**"
            - "!**/internal/ai/**"
            - "!**/cmd/shipnote/cli/**"
          deny:
            - pkg: "net/http"
              desc: "Outbound HTTP only allowed in internal/collect/github and internal/ai. Move the call there or open an ADR."

  exclusions:
    rules:
      # Tests may import anything for fixtures.
      - path: _test\.go
        linters: [depguard]

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
