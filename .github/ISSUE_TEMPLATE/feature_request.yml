name: Feature request
description: Suggest an enhancement.
labels: ['enhancement', 'triage']
body:
 - type: textarea
   id: problem
   attributes:
    label: What problem does this solve?
    description: Describe the use case before the solution.
   validations:
    required: true
 - type: textarea
   id: proposal
   attributes:
    label: Proposed solution
   validations:
    required: true
 - type: textarea
   id: alternatives
   attributes:
    label: Alternatives considered
 - type: checkboxes
   id: scope
   attributes:
    label: Scope check
    options:
     - label: This fits the OSS CLI/CI scope (not a hosted/cloud feature).
     - label: This does not require shipnote to make outbound network calls outside GitHub or AI providers.
