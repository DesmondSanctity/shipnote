name: ci

on:
 push:
  branches: [ main ]
 pull_request:

permissions:
 contents: read

concurrency:
 group: ci-${{ github.ref }}
 cancel-in-progress: true

jobs:
 test:
  name: test (${{ matrix.os }})
  runs-on: ${{ matrix.os }}
  strategy:
   fail-fast: false
   matrix:
    os: [ ubuntu-latest, macos-latest ]
  steps:
   - uses: actions/checkout@v4

   - uses: actions/setup-go@v5
     with:
      go-version: "1.24"
      cache: true

   - name: go vet
     run: go vet ./...

   - name: build
     run: go build ./...

   - name: test
     run: go test -race -count=1 ./...

 lint:
  name: lint
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4

   - uses: actions/setup-go@v5
     with:
      go-version: "1.24"
      cache: true

   - uses: golangci/golangci-lint-action@v6
     with:
      version: latest
      args: --timeout=5m
